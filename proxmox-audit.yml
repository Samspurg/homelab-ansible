- name: Read-only Proxmox host audit
  hosts: proxmox
  gather_facts: true

tasks:
- name: Collect Proxmox version
ansible.builtin.command: pveversion -v
register: pve_version
changed_when: false
- name: Collect cluster status
ansible.builtin.command: pvecm status
register: cluster_status
changed_when: false
failed_when: false
- name: Collect storage status
ansible.builtin.command: pvesm status
register: storage_status
changed_when: false
failed_when: false
- name: List failed systemd units
ansible.builtin.command: systemctl --failed --no-legend --plain
register: failed_units
changed_when: false
failed_when: false
- name: Check root filesystem space
ansible.builtin.command: df -h /
register: root_disk
changed_when: false
- name: Display host audit
      ansible.builtin.debug:
        msg:
          - "=== {{ inventory_hostname }} ({{ ansible_host | default(inventory_hostname) }}) ==="
          - "OS: {{ ansible_distribution }} {{ ansible_distribution_version }}"
          - "Kernel: {{ ansible_kernel }}"
          - "CPU threads: {{ ansible_processor_vcpus }}"
          - "RAM: {{ ansible_memtotal_mb }} MiB"
          - "Uptime: {{ (ansible_uptime_seconds / 3600) | int }} hours"
          - "Proxmox version: {{ pve_version.stdout_lines | join(' | ') }}"
          - "Cluster status: {{ cluster_status.stdout | default(cluster_status.stderr, true) | trim | default('no output', true) }}"
          - "Storage status: {{ storage_status.stdout | default(storage_status.stderr, true) | trim | default('no output', true) }}"
          - "Failed units: {{ failed_units.stdout | trim if (failed_units.stdout | trim) else 'none reported' }}"
          - "Root filesystem: {{ root_disk.stdout_lines | join(' | ') }}"
